# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Without an explicit ceiling, a hanging notification endpoint could block the
    # single messenger:consume worker indefinitely instead of surfacing as a retryable
    # TransportExceptionInterface (the mock's TIMEOUT marker sleeps 10s specifically to
    # exceed this).
    http_client:
        default_options:
            timeout: 5

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
