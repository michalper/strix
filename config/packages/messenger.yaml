framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: '%env(int:MESSENGER_RETRY_MAX_RETRIES)%'
                    delay: '%env(int:MESSENGER_RETRY_DELAY_MS)%'
                    multiplier: '%env(float:MESSENGER_RETRY_MULTIPLIER)%'
                    max_delay: '%env(int:MESSENGER_RETRY_MAX_DELAY_MS)%'
                options:
                    exchange:
                        name: payment_events
                    queues:
                        payment_notifications: ~
            # Doctrine-backed DLQ: same Postgres, SQL-inspectable via the
            # messenger_messages table / `bin/console messenger:failed:show`,
            # instead of a second AMQP queue.
            failed: 'doctrine://default?queue_name=failed'

        routing:
            App\Message\SendPaymentNotification: async
