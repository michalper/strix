services:
  worker:
    environment:
      # Fast, constant-delay retries (2 attempts, 200ms) so the E2E suite doesn't
      # have to wait through the full production backoff schedule to reach the DLQ.
      MESSENGER_RETRY_MAX_RETRIES: "2"
      MESSENGER_RETRY_DELAY_MS: "200"
      MESSENGER_RETRY_MULTIPLIER: "1"
      MESSENGER_RETRY_MAX_DELAY_MS: "200"

  # "app"/"worker" are built --no-dev (no PHPUnit); this runs the e2e suite with dev
  # tooling against the already-running compose network, code bind-mounted so it
  # never needs rebuilding for a test-only change.
  e2e-runner:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    volumes:
      - .:/app
    working_dir: /app
    command: ["sleep", "infinity"]
    depends_on:
      app: { condition: service_started }
      worker: { condition: service_started }
      notification-mock: { condition: service_started }
