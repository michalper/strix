services:
  worker:
    environment:
      # Fast, constant-delay retries (2 attempts, 200ms) so the E2E suite doesn't
      # have to wait through the full production backoff schedule to reach the DLQ.
      MESSENGER_RETRY_MAX_RETRIES: "2"
      MESSENGER_RETRY_DELAY_MS: "200"
      MESSENGER_RETRY_MULTIPLIER: "1"
      MESSENGER_RETRY_MAX_DELAY_MS: "200"
